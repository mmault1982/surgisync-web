openapi: 3.0.3
info:
  title: SurgiScribe API Documentation
  version: v1
  description: API documentation with JWT Authentication
paths:
  /api/v1/banner-state/:
    get:
      operationId: get_banner_state
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Onboarding banner state for the user
  /api/v1/banner-state/dismiss/:
    post:
      operationId: dismiss_banner
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissBannerRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DismissBannerRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DismissBannerRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Updated banner state
  /api/v1/banner-state/preferences/:
    patch:
      operationId: update_banner_preferences
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateBannerPreferencesRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateBannerPreferencesRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateBannerPreferencesRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Updated banner state
  /api/v1/banner-state/reset/:
    post:
      operationId: reset_banner_state
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Banner state reset
  /api/v1/cases/:
    get:
      operationId: get_my_cases
      description: Wrapper view for case list/create operations.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Cases with date_of_surgery >= this date (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Cases with date_of_surgery <= this date (YYYY-MM-DD)
      - in: query
        name: facility
        schema:
          type: integer
        description: Filter by facility ID
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Cases per page (max 20)
      - in: query
        name: procedure
        schema:
          type: integer
        description: Filter by procedure ID
      - in: query
        name: search
        schema:
          type: string
        description: Multi-field search (case name, surgeon name, facility name, procedure
          name)
      - in: query
        name: sort_by
        schema:
          type: string
          enum:
          - case_name
          - created_at
          - date_of_surgery
        description: 'Sort field (default: created_at)'
      - in: query
        name: sort_order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: 'Sort order (default: desc)'
      - in: query
        name: surgeon
        schema:
          type: integer
        description: Filter by surgeon ID
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Paginated list of the user's cases
    post:
      operationId: create_case
      description: Wrapper view for case list/create operations.
      tags:
      - Cases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
          description: ''
  /api/v1/cases/{case_id}/:
    get:
      operationId: get_case_by_id
      description: Wrapper view for case delete/update/get operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
          description: ''
    put:
      operationId: update_case
      description: Wrapper view for case delete/update/get operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
          description: ''
    delete:
      operationId: delete_case
      description: Wrapper view for case delete/update/get operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Case deleted
  /api/v1/cases/{case_id}/generate_pdf/:
    get:
      operationId: generate_case_pdf
      description: Generate case PDF.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Case PDF generated; returns the PDF URL/details
  /api/v1/cases/{case_id}/labels/:
    get:
      operationId: get_case_labels
      description: Wrapper view for case item list/create/delete operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Labels per page
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Paginated case labels
    post:
      operationId: create_case_labels
      description: Wrapper view for case item list/create/delete operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCaseItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCaseItemRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Case labels created
    delete:
      operationId: delete_case_labels
      description: Wrapper view for case item list/create/delete operations.
      parameters:
      - in: path
        name: case_id
        schema:
          type: integer
        required: true
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Case labels deleted
  /api/v1/cases/labels/{id}/:
    get:
      operationId: get_barcode_details_of_label
      description: Wrapper view for case label get/update operations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Cases
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Barcode details for the label
    put:
      operationId: update_label
      description: Wrapper view for case label get/update operations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Cases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseItemUpdateRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Label updated
  /api/v1/change_password/:
    post:
      operationId: change_password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
  /api/v1/dashboard-stats/:
    get:
      operationId: dashboard_stats
      description: Get dashboard statistics for the authenticated user
      tags:
      - Users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
          description: ''
  /api/v1/directory/surgeons/:
    get:
      operationId: list_surgeons_catalog
      description: 'Surgeons this organization may choose from, sorted by name: the
        shared roster plus any the organization owns. Always paginated. This is the
        management list; the legacy `/api/v1/surgeons/` remains the per-facility lookup
        its clients depend on.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by name or NPI
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSurgeonCatalogList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
    post:
      operationId: create_surgeon_catalog
      description: Add a surgeon to this organization. Organization admins only. A
        10-digit NPI is optional; when given it is what identifies the surgeon, so
        two people sharing a name can both be recorded.
      tags:
      - Inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurgeonWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SurgeonWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SurgeonWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeonCatalog'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: Validation failed. Keys are field names, plus `non_field_errors`
            for payload-level errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
  /api/v1/directory/surgeons/{id}/:
    get:
      operationId: retrieve_surgeon
      description: One surgeon, if this organization may see them.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeonCatalog'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No such object, or it belongs to another organization. The
            two are deliberately indistinguishable.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
    patch:
      operationId: partial_update_surgeon
      description: Amend a surgeon this organization owns. Organization admins only.
        Name and NPI are both writable.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSurgeonWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSurgeonWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSurgeonWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeonCatalog'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: Validation failed. Keys are field names, plus `non_field_errors`
            for payload-level errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No such object, or it belongs to another organization. The
            two are deliberately indistinguishable.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
    delete:
      operationId: delete_surgeon
      description: Remove a surgeon this organization owns. Organization admins only.
        A soft delete, refused while cases or facility assignments still reference
        them.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeonCatalog'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
          description: 'Cases or facility assignments still reference this surgeon
            (`surgeon_in_use`). The message names how many of each. The database cannot
            refuse this: both foreign keys are `CASCADE`, so an unguarded delete would
            destroy those rows rather than being rejected.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No such object, or it belongs to another organization. The
            two are deliberately indistinguishable.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
  /api/v1/directory/surgeons/import/:
    post:
      operationId: import_surgeons
      description: Create surgeons in bulk from a CSV or Excel file with a `name`
        column and an optional `npi_number` column. Organization admins only. Surgeons
        already available — matched on NPI where a row has one, otherwise on name
        — are **skipped**, not re-created and not errors, so re-running the same file
        is safe. A row whose NPI is not 10 digits fails rather than being imported
        without it. Send `dry_run=true` to preview.
      tags:
      - Inventory
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: Validation failed. Keys are field names, plus `non_field_errors`
            for payload-level errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
  /api/v1/directory/surgeons/import/template/:
    get:
      operationId: surgeon_import_template
      description: An empty CSV with the header row the importer expects.
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
  /api/v1/facilities/:
    get:
      operationId: list_facilities
      description: Get list of active facilities with optional search.
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search by name
      - in: query
        name: search_all
        schema:
          type: boolean
        description: Override to search all facilities
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facility'
          description: ''
  /api/v1/facility-assignments/:
    get:
      operationId: api_v1_facility_assignments_list
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityAssignmentList'
          description: ''
    post:
      operationId: api_v1_facility_assignments_create
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityAssignmentDetail'
          description: ''
  /api/v1/facility-assignments/{id}/:
    get:
      operationId: api_v1_facility_assignments_retrieve
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this My Facility.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityAssignmentDetail'
          description: ''
    put:
      operationId: api_v1_facility_assignments_update
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this My Facility.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityAssignmentDetail'
          description: ''
    patch:
      operationId: api_v1_facility_assignments_partial_update
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this My Facility.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFacilityAssignmentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFacilityAssignmentDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFacilityAssignmentDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityAssignmentDetail'
          description: ''
    delete:
      operationId: api_v1_facility_assignments_destroy
      description: |-
        ViewSet for managing Facility Assignments.

        list: Get all facility assignments
        create: Assign a user to a facility
        retrieve: Get a single assignment by ID
        update: Update an assignment
        destroy: Remove an assignment
        my_facilities: Get facilities assigned to the current user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this My Facility.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/facility-assignments/bulk_assign/:
    post:
      operationId: api_v1_facility_assignments_bulk_assign_create
      description: Assign a user to multiple facilities at once.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentDetailRequest'
          multipart/form-data:
