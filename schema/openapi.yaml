  /api/v1/inventory/items/:
    post:
      operationId: create_case_item
      description: Create an item and optionally attach it to a case OR quote. Pass
        `case_id` to create a CaseItems entry, or `quote_id` to create a QuoteItems
        entry. Exactly one of the two must be provided; if neither is set, returns
        only the created item; if both are set, returns 400. `manufacturer_name` is
        matched against **your organization's** manufacturers and created there if
        absent, so a name another organization owns yields a new row of your own rather
        than theirs. The caller must belong to an organization; 400 otherwise.
      parameters:
      - in: query
        name: case_id
        schema:
          type: number
        description: ID of the case (optional; mutually exclusive with quote_id)
      - in: query
        name: quote_id
        schema:
          type: number
        description: ID of the quote (optional; mutually exclusive with case_id)
      tags:
      - Inventory
      requestBody:
        content:
