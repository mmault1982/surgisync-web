  /api/v1/parts/:
    get:
      operationId: list_parts
      description: 'The catalog of parts the requesting organization can choose from:
        those belonging to its own manufacturers. Not stock on hand — see `/api/v1/stock-items/`
        for that. **Always paginated**; the response shape does not vary with the
        query parameters, and the default page is wide enough to hold the whole catalog
        in one response. Sorted by name unless `ordering` says otherwise.'
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - component
          - kit
        description: 'Restrict to one kind of part: `kit` (has a bill of materials)
          or `component` (a loose part).'
      - in: query
        name: manufacturer_id
        schema:
          type: array
          items:
            type: integer
        description: Restrict to parts of these manufacturers. Repeatable — send the
          key once per value (`?manufacturer_id=5&manufacturer_id=9`), which ORs them.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -description
          - -manufacturer_name
          - -name
          - -reference_number
          - description
          - manufacturer_name
          - name
          - reference_number
        description: Sort column. Both directions are listed explicitly because an
          enum cannot express a prefix. Defaults to `description`; `name` is a deprecated
          alias of it. Any other value is a 400. Note kits never carry a reference
          number, so `reference_number` groups every kit at one end.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reference_number
        schema:
          type: string
        description: 'Exact, case-insensitive catalog number. May match more than
          one part: the number is unique per manufacturer, not across the catalog.
          Kits never carry one.'
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match across description, reference
          number and manufacturer name. `description` is the catalog label for every
          row, so it covers what a search over the deprecated `name` used to.
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartListList'
          description: ''
        '400':
