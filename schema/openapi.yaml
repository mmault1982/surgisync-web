        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
    post:
      operationId: create_inventory_kit_legacy
      description: Register a new physical inventory kit. Send as multipart/form-data
