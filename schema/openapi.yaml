    PartComponent:
      type: object
      description: |-
        One row of a kit's bill of materials.

        The read shape for all four operations, including the two writes — a write
        that answers with its own input is the defect the response-accuracy gate
        caught on `/api/v1/procedures/`, and `PartDetailView.update` carries the
        note about it.

        Flattened rather than nested. A client rendering a BOM table wants four
        strings and a number per row, and `item` alone is enough to link onward to
        the component's own detail endpoint; nesting the whole `Part` would ship a
        price and four barcode images per row to draw a table that shows none of
        them.
      properties:
        id:
          type: integer
          readOnly: true
        item:
          type: integer
          readOnly: true
        item_uuid:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
          readOnly: true
        reference_number:
          type: string
          readOnly: true
          nullable: true
        quantity:
          type: integer
          readOnly: true
      required:
      - description
      - id
      - item
      - item_uuid
      - quantity
      - reference_number
    PartComponentWriteRequest:
      type: object
      description: |-
        Add a component to a kit.

        `kit` is deliberately not a field: it comes from the URL, which is what
        makes "forgot to scope this to the kit" unrepresentable rather than merely
        untested — the failure mode `/api/v1/kit-items/?kit=` left open.

        Every refusal below is raised as a **field** error rather than left to the
        database, so a client can render it under the control the user typed into.
        The three the model backstops — self-containment (a CHECK), duplication (a
        UNIQUE) and cycles (`PartComponent.clean()`) — would otherwise surface as a
        500 on an `IntegrityError`.
      properties:
        item:
          type: integer
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
          default: 1
      required:
      - item
    PartDetail:
      type: object
      description: |-
        One catalog part, on its own.

        `PartListSerializer` widened by `udi` and `list_price` — the two fields the
        Product Catalog's detail screen shows and the listing deliberately does
        not. Widening a projection is backward-compatible; the list stays narrow
        because it is also the Receive form's picker source, and a picker has no
        business carrying pricing.

        Subclassing rather than restating the nine shared fields: the `name` alias
        and the `manufacturer_name` flattening are the same declarations, and two
        copies of them is how they drift.

        This is the read shape for retrieve, create, update **and** delete —
        `PartWriteSerializer` never renders.
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Stable external identifier; survives the catalog merge.
        name:
          type: string
          readOnly: true
          description: DEPRECATED — use description.
        description:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
          description: |-
            Whether this part is a kit (has a bill of materials) or a loose component.

            * `kit` - Kit
            * `component` - Component
        reference_number:
          type: string
          readOnly: true
          nullable: true
          description: Unique catalog number used for scanning and inventory lookup.
            Empty for kits.
        is_serialized:
          type: boolean
          readOnly: true
          description: Serialized parts are stocked one row per physical unit (quantity
            1, own lot/expiry); bulk parts are stocked one row per location with a
            quantity.
        manufacturer:
          type: integer
          readOnly: true
        manufacturer_name:
          type: string
          readOnly: true
        udi:
          type: string
          readOnly: true
          nullable: true
          description: Unique Device Identifier - FDA-required tracking number for
            medical devices.
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
      required:
      - description
      - id
      - is_serialized
      - kind
      - list_price
      - manufacturer
      - manufacturer_name
      - name
      - reference_number
      - udi
      - uuid
    PartList:
      type: object
      description: |-
        One catalog part in a `/api/v1/parts/` listing.

        Deliberately narrow. `Part` carries thirty-odd fields including four
        barcode images and a price column; this is the picker projection —
        enough to identify a part and show it in a dropdown, and nothing that
        invites a client to treat the list as a pricing or media source. Widening
        it later is backward-compatible; narrowing it is not.

        `kind` is on the wire because one endpoint serves kits and loose
        components, so a client that omits the filter still has to tell them apart.

        Modelled on `KitSerializer` above, which is the same projection from before
        the catalog merge gave kits and items one table.
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Stable external identifier; survives the catalog merge.
        name:
          type: string
          readOnly: true
          description: DEPRECATED — use description.
        description:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
          description: |-
            Whether this part is a kit (has a bill of materials) or a loose component.

            * `kit` - Kit
            * `component` - Component
        reference_number:
          type: string
          readOnly: true
          nullable: true
          description: Unique catalog number used for scanning and inventory lookup.
            Empty for kits.
        is_serialized:
          type: boolean
          readOnly: true
          description: Serialized parts are stocked one row per physical unit (quantity
            1, own lot/expiry); bulk parts are stocked one row per location with a
            quantity.
        manufacturer:
          type: integer
          readOnly: true
        manufacturer_name:
          type: string
          readOnly: true
      required:
      - description
      - id
      - is_serialized
      - kind
      - manufacturer
      - manufacturer_name
      - name
      - reference_number
      - uuid
    PartWriteRequest:
