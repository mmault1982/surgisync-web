    HanselCredential:
      type: object
      description: |-
        Read and write. One serializer, not a List/Detail pair — the two would be
        byte-identical here (no heavy relations, no derived counts) and would put two
        components in the schema for one shape.
      properties:
        id:
          type: integer
          readOnly: true
        parent_company:
          type: integer
          title: Organization
          description: The organization these credentials belong to.
        parent_company_name:
          type: string
          readOnly: true
          nullable: true
        client_id:
          type: string
          description: Hansel OAuth client id. Not secret.
          maxLength: 255
        workspace_id:
          type: string
          format: uuid
          description: Hansel workspace UUID. Sent only as the OAuth scope `workspace:<uuid>`.
        client_secret_set:
          type: boolean
          readOnly: true
          description: Whether a secret is stored. The secret itself is never returned.
        client_secret_last4:
          type: string
          readOnly: true
          description: Last 4 characters of the secret, so the UI can show which one
            is stored.
        secret_readable:
          type: boolean
          readOnly: true
          description: False when the stored secret was encrypted in a different environment
            (e.g. a production snapshot restored into staging). The credential looks
            configured but cannot be used — re-enter it.
        is_active:
          type: boolean
          description: Operational state of the integration (distinct from soft-delete).
        sync_enabled:
          type: boolean
          description: Use this workspace for outbound asset sync. At most one active
            credential per organization may have this set.
        default_manufacturer_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel manufacturer UUID used when a part's manufacturer has
            no explicit mapping. Required to create assets, since Hansel's asset create
            demands a manufacturer from their UUID space.
        default_asset_type_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel asset-type UUID applied to every asset we create. Required
            to create assets; we have no local equivalent to map from.
        last_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When these credentials last exchanged successfully for a token.
        last_verification_error:
          type: string
          readOnly: true
          description: Failure code from the last verification attempt; empty when
            the last one passed.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_id
      - client_secret_last4
      - client_secret_set
      - created_at
      - id
      - last_verification_error
      - last_verified_at
      - parent_company
      - parent_company_name
      - secret_readable
      - updated_at
      - workspace_id
    HanselCredentialRequest:
      type: object
      description: |-
        Read and write. One serializer, not a List/Detail pair — the two would be
        byte-identical here (no heavy relations, no derived counts) and would put two
        components in the schema for one shape.
      properties:
        parent_company:
          type: integer
          title: Organization
          description: The organization these credentials belong to.
        client_id:
          type: string
          minLength: 1
          description: Hansel OAuth client id. Not secret.
          maxLength: 255
        workspace_id:
          type: string
          format: uuid
          description: Hansel workspace UUID. Sent only as the OAuth scope `workspace:<uuid>`.
        client_secret:
          type: string
          writeOnly: true
          minLength: 8
          description: Hansel OAuth client secret. Write-only — never returned. Omit
            on PATCH to keep the stored value.
          maxLength: 512
        is_active:
          type: boolean
          description: Operational state of the integration (distinct from soft-delete).
        sync_enabled:
          type: boolean
          description: Use this workspace for outbound asset sync. At most one active
            credential per organization may have this set.
        default_manufacturer_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel manufacturer UUID used when a part's manufacturer has
            no explicit mapping. Required to create assets, since Hansel's asset create
            demands a manufacturer from their UUID space.
        default_asset_type_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel asset-type UUID applied to every asset we create. Required
            to create assets; we have no local equivalent to map from.
      required:
      - client_id
      - client_secret
      - parent_company
      - workspace_id
    HanselVerifyResult:
      type: object
      description: |-
        Outcome of a live credential check.

        Returned with HTTP 200 even when the credentials fail: the *request*
        succeeded, and the answer is that the credentials do not work. A 4xx would
        assert the client's request was malformed, which it was not.
      properties:
        ok:
          type: boolean
          description: True when Hansel issued a token.
        error:
          type: string
          description: 'Stable code, empty when `ok`. One of: `invalid_credentials`,
            `service_unavailable`, `malformed_response`, `credential_unreadable`,
            `not_configured`.'
        message:
          type: string
          description: Display text. May change without notice.
        checked_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          nullable: true
          description: Token lifetime in seconds; null unless `ok`.
      required:
      - checked_at
      - error
      - expires_in
      - message
      - ok
    HistoryChange:
      type: object
      description: 'One changed field: old/new are JSON primitives (FKs as display
        strings).'
      properties:
        field:
          type: string
          readOnly: true
        old:
          readOnly: true
          nullable: true
        new:
          readOnly: true
          nullable: true
      required:
      - field
      - new
      - old
    HistoryTypeEnum:
      enum:
      - +
      - '~'
      - '-'
      type: string
      description: |-
        * `+` - +
        * `~` - ~
        * `-` - -
    HistoryUser:
      type: object
      description: The user who made a historical change.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    ImportReport:
      type: object
      description: The outcome of an import, whether or not anything was written.
      properties:
        dry_run:
          type: boolean
          description: True when nothing was written and this is a preview.
        total_rows:
          type: integer
        created:
          type: integer
          description: Created, or — on a dry run — what would be created.
        updated:
          type: integer
          description: Amended in place, or — on a dry run — what would be amended.
        skipped:
          type: integer
          description: Already present and already agreeing. Not failures.
        failed:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
      required:
      - created
      - dry_run
      - failed
      - rows
      - skipped
      - total_rows
      - updated
    ImportRequestRequest:
      type: object
      description: |-
        A bulk-import upload.

        Declared as a serializer rather than read off `request.data` so the
        contract documents the multipart body, and so a generated client knows
        `file` is binary — which is what makes the browser call one line.
      properties:
        file:
          type: string
          format: binary
          description: CSV or Excel (.csv, .xlsx). Which columns are required depends
            on the endpoint — download its template. 10MB and 2000 rows maximum.
        dry_run:
          type: boolean
          default: false
          description: Decide every row and report the outcome without writing anything.
            The preview half of the flow.
      required:
      - file
    ImportRow:
      type: object
      description: What happened to one row of the file.
      properties:
        row:
          type: integer
          description: Spreadsheet row number. Data starts at 2; row 1 is the header.
        name:
          type: string
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          description: |-
            `created` — a new record. `updated` — a record already existed and at least one value in the file differed, so it was amended in place. `skipped` — a record already existed and the file agreed with it in every stated field, so there was nothing to do. `failed` — the row could not be used. Only `failed` is an error: `updated` and `skipped` are the normal outcomes of re-running a file. Importers over records with no amendable fields — manufacturers, procedures, surgeons — never emit `updated`.

            * `created` - created
            * `updated` - updated
            * `skipped` - skipped
            * `failed` - failed
        code:
          type: string
          description: Stable machine-readable reason. Branch on this, never on `detail`.
        detail:
          type: string
          description: Display text. May change without notice.
      required:
      - name
      - outcome
      - row
