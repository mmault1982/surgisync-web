    PatchedHanselCredentialRequest:
      type: object
      description: |-
        Read and write. One serializer, not a List/Detail pair — the two would be
        byte-identical here (no heavy relations, no derived counts) and would put two
        components in the schema for one shape.
      properties:
        parent_company:
          type: integer
          title: Organization
          description: The organization these credentials belong to.
        client_id:
          type: string
          minLength: 1
          description: Hansel OAuth client id. Not secret.
          maxLength: 255
        workspace_id:
          type: string
          format: uuid
          description: Hansel workspace UUID. Sent only as the OAuth scope `workspace:<uuid>`.
        client_secret:
          type: string
          writeOnly: true
          minLength: 8
          description: Hansel OAuth client secret. Write-only — never returned. Omit
            on PATCH to keep the stored value.
          maxLength: 512
        is_active:
          type: boolean
          description: Operational state of the integration (distinct from soft-delete).
        sync_enabled:
          type: boolean
          description: Use this workspace for outbound asset sync. At most one active
            credential per organization may have this set.
        default_manufacturer_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel manufacturer UUID used when a part's manufacturer has
            no explicit mapping. Required to create assets, since Hansel's asset create
            demands a manufacturer from their UUID space.
        default_asset_type_id:
          type: string
          format: uuid
          nullable: true
          description: Hansel asset-type UUID applied to every asset we create. Required
            to create assets; we have no local equivalent to map from.
    PatchedInventoryKitDetailRequest:
      type: object
      description: |-
        Full serializer for detail/create/update views.

        `photo` is the primary photo, kept for clients written before the photos
        collection existed: readable as a presigned URL and still writable, in
        which case it replaces the primary photo (see apply_legacy_photo). The
        view is responsible for calling that helper on create; update() does it
        here.
      properties:
        part:
          type: integer
          description: The catalog part this stock is of; accepts a pk or a uuid.
            Required on create unless the deprecated `kit` is sent instead — exactly
            one of the two.
        kit:
          type: integer
          description: DEPRECATED — use `part`. Same accepted values; sending both
            with different values is rejected.
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: How many units this row represents. Always 1 for serialized
            parts (one row per physical unit); the on-hand count for bulk parts at
            one location and lot.
        manufacturer_kit_id:
          type: string
          nullable: true
          title: Kit ID
          description: Manufacturer-assigned identifier for this physical kit unit.
          maxLength: 64
        lot_code:
          type: string
          nullable: true
          description: Manufacturer lot/batch code for this physical kit unit.
          maxLength: 64
        udi:
          type: string
          nullable: true
          description: Full UDI carrier string for this physical unit — device identifier
            plus production identifiers (lot/serial/expiry). Distinct from the catalog-level
            Part.udi (DI only).
          maxLength: 128
        assigned_to_parent_company:
          type: integer
          nullable: true
          title: Assigned to organization
        assigned_to_representative:
          type: integer
          nullable: true
        assigned_to_facility:
          type: integer
          nullable: true
        physical_location:
          type: string
          nullable: true
          description: Free-text description of where the kit physically is.
          maxLength: 255
        ownership_type:
          $ref: '#/components/schemas/OwnershipTypeEnum'
        loaner_due_date:
          type: string
          format: date
          nullable: true
          description: Date a loaned kit is due back.
        expiration_date:
          type: string
          format: date
          nullable: true
        last_sterilized_at:
          type: string
          format: date-time
          nullable: true
          title: Last sterilized
          description: When this physical unit last completed sterilization.
        is_complete:
          type: boolean
        is_wrapped:
          type: boolean
        is_signed_in:
          type: boolean
        is_returned:
          type: boolean
        is_lost:
          type: boolean
        is_other:
          type: boolean
        photo:
          type: string
          format: binary
          nullable: true
        beacon_id:
          type: string
          writeOnly: true
        notes:
          type: string
          nullable: true
        is_draft:
          type: boolean
          title: Draft
          description: Draft documents are not finalized and can still be edited.
            They are hidden from admin views by default.
