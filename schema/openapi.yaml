      deprecated: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryKitDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: Validation failed. Keys are field names, plus `non_field_errors`
            for payload-level errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
        '409':
          content:
            application/json:
              schema:
