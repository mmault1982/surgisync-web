        only. A soft delete, refused while cases or quotes still reference it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureCatalog'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
          description: 'Cases or quotes still reference this procedure (`procedure_in_use`).
            The message names how many of each. The database cannot refuse this: the
            foreign keys are `CASCADE`, so an unguarded delete would destroy those
            cases and quotes rather than being rejected.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No such object, or it belongs to another organization. The
            two are deliberately indistinguishable.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
