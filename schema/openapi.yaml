            * `entity_global_admin` - Entity Global Admin
            * `admin` - Admin
            * `non_admin` - Non-Admin
        parent_company:
          type: integer
          nullable: true
          description: Organization this user belongs to (if distributor/admin).
        parent_company_name:
          type: string
          readOnly: true
        manufacturer:
          type: integer
          nullable: true
          description: Manufacturer this user represents (if manufacturer rep).
        manufacturer_name:
          type: string
          readOnly: true
        facility:
          type: integer
          nullable: true
          description: Facility this user works at (if facility staff).
        facility_name:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - facility_name
      - id
      - manufacturer_name
      - organization_name
      - parent_company_name
      - updated_at
      - user
      - user_email
    UserProfileDetailRequest:
      type: object
      description: Full serializer for detail/create/update views.
      properties:
        user:
          type: integer
        organization_type:
          nullable: true
          description: |-
            User belongs to exactly ONE: parent company, manufacturer, or facility.

            * `distributor` - Distributor
            * `oem` - OEM
            * `facility` - Facility (Hospital)
          oneOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Controls admin panel access and data visibility. PLATFORM_ADMIN is handled by is_superuser flag.

            * `entity_global_admin` - Entity Global Admin
            * `admin` - Admin
            * `non_admin` - Non-Admin
        parent_company:
          type: integer
          nullable: true
          description: Organization this user belongs to (if distributor/admin).
        manufacturer:
          type: integer
          nullable: true
          description: Manufacturer this user represents (if manufacturer rep).
        facility:
          type: integer
          nullable: true
