    UserProfileList:
      type: object
      description: Lightweight serializer for list views.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        organization_type:
          nullable: true
          description: |-
            User belongs to exactly ONE: parent company, manufacturer, or facility.

