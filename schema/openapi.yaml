  /api/v1/stock-items/:
    get:
      operationId: api_v1_stock_items_list
      description: List the requesting user's organization inventory kits as a paginated,
        searchable, filterable collection.
      parameters:
      - in: query
        name: assigned_to_facility
        schema:
          type: array
          items:
            type: integer
        description: Filter by assigned facility id. Repeatable.
      - in: query
        name: assigned_to_representative
        schema:
          type: array
          items:
            type: integer
        description: Filter by assigned representative (user) id. Repeatable.
      - in: query
        name: expiration_date_after
        schema:
          type: string
          format: date
        description: Expiring on or after this date (YYYY-MM-DD).
      - in: query
        name: expiration_date_before
        schema:
          type: string
          format: date
        description: Expiring on or before this date (YYYY-MM-DD). Combine with _after
          for the 30/60/90-day buckets.
      - in: query
        name: has_expiration_date
        schema:
          type: boolean
        description: true returns only stock with an expiration date; false only stock
          without one (the 'No Expiration' preset).
      - in: query
        name: has_loaner_due_date
        schema:
          type: boolean
        description: true returns only stock with a loaner due date.
      - in: query
        name: in_transit
        schema:
          type: boolean
        description: Filter by transit state. true returns only kits linked to a transfer
          (in transit); false returns only kits with no transfer link. Omit for no
          filter.
      - in: query
        name: is_complete
        schema:
          type: boolean
        description: Filter by completeness flag. Accepts true/false, 1/0, yes/no,
          on/off (case-insensitive); anything else is a 400.
      - in: query
        name: is_lost
        schema:
          type: boolean
        description: Filter by whether the unit is marked lost.
      - in: query
        name: is_other
        schema:
          type: boolean
        description: Filter by the catch-all 'other' status flag.
      - in: query
        name: is_returned
        schema:
          type: boolean
        description: Filter by whether the unit has been returned.
      - in: query
        name: is_serialized
        schema:
          type: boolean
        description: 'Filter by how the part is stocked: true = one row per physical
          unit, false = bulk rows carrying a quantity.'
      - in: query
        name: is_signed_in
        schema:
          type: boolean
        description: Filter by whether the unit is signed in.
      - in: query
        name: is_wrapped
        schema:
          type: boolean
        description: Filter by sterile-wrap state.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - component
          - kit
        description: Filter to stock of catalog kits or of loose components.
      - in: query
        name: kit
        schema:
          type: string
        description: DEPRECATED — use `part`. Same accepted values.
        deprecated: true
      - in: query
        name: loaner_due_date_after
        schema:
          type: string
          format: date
        description: Loaner due back on or after this date (YYYY-MM-DD).
      - in: query
        name: loaner_due_date_before
        schema:
          type: string
          format: date
        description: Loaner due back on or before this date (YYYY-MM-DD). Drives the
          overdue-loaner alert.
      - in: query
        name: manufacturer_id
        schema:
          type: array
          items:
            type: integer
        description: 'Filter by manufacturer id. Repeatable: ?manufacturer_id=5&manufacturer_id=9
          returns the union of both.'
      - in: query
        name: manufacturer_kit_id
        schema:
          type: array
          items:
            type: string
        description: Exact match on the manufacturer-assigned kit id. Repeatable.
      - in: query
        name: manufacturer_kit_id_contains
        schema:
          type: string
        description: Case-insensitive substring match on the manufacturer kit id,
          for the Kit ID column's type-to-filter box. Use `manufacturer_kit_id` for
          exact multi-select.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -assigned_to_name
          - -created_at
          - -expiration_date
          - -is_complete
          - -last_sterilized_at
          - -loaner_due_date
          - -manufacturer_kit_id
          - -manufacturer_name
          - -ownership_type
          - -part_description
          - -part_name
          - -physical_location
          - -quantity
          - assigned_to_name
          - created_at
          - expiration_date
          - is_complete
          - last_sterilized_at
          - loaner_due_date
          - manufacturer_kit_id
          - manufacturer_name
          - ownership_type
          - part_description
          - part_name
          - physical_location
          - quantity
        description: Sort column. Both directions are listed explicitly because an
          enum cannot express a prefix — and the default itself is descending, so
          a client restricted to the bare names could not even ask for it. Any other
          value is a 400.
      - in: query
        name: ownership_type
        schema:
          type: array
          items:
            type: string
            enum:
            - consigned
            - loaned
            - owned
        description: Filter by ownership type. Repeatable.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page.
      - in: query
        name: part
        schema:
          type: string
        description: 'Filter by catalog Part: integer id or part uuid. Prefer the
          uuid — catalog integer IDs moved in the catalog merge.'
      - in: query
        name: physical_location
        schema:
          type: array
          items:
            type: string
        description: Case-insensitive EXACT location match, repeatable for multi-select.
          For substring matching use `search`, which already covers this field.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive search across kit name, manufacturer name, manufacturer_kit_id,
          udi, and physical_location.
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - complete
            - incomplete
            - lost
            - other
            - signed_in
            - signed_out
            - unwrapped
            - wrapped
        description: 'Filter by status label, repeatable and OR-ed together: ?status=lost&status=incomplete
          returns stock that is either. This is what the table''s Status column needs
          — the individual is_* flags AND together instead, so they cannot express
          ''either''. Note some labels are the false side of a flag: `incomplete`
          is is_complete=false, `unwrapped` is is_wrapped=false, and `signed_out`
          is is_signed_in=false.'
      - in: query
        name: udi
        schema:
          type: string
        description: Exact match on the unit's full UDI string.
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryKitListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          description: Validation failed. Keys are field names, plus `non_field_errors`
            for payload-level errors.
        '401':
          content:
            application/json:
