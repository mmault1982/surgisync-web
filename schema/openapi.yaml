    ResetPasswordEmailRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address
        new_password:
          type: string
          minLength: 1
          description: New password
      required:
      - email
      - new_password
    RoleEnum:
      enum:
      - entity_global_admin
      - admin
      - non_admin
      type: string
      description: |-
        * `entity_global_admin` - Entity Global Admin
        * `admin` - Admin
        * `non_admin` - Non-Admin
    SetPasswordFromInviteRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: Invite token
        password:
          type: string
          minLength: 1
          description: New password
      required:
      - password
      - token
    StringFacetResponse:
      type: object
      description: Distinct free-text values, sorted.
      properties:
        results:
          type: array
          items:
            type: string
      required:
      - results
    Surgeon:
      type: object
      description: |-
        The lookup shape, unchanged.

        Nested inside case payloads and returned by the legacy `/surgeons/`, both
        of which are read by shipped clients — so it deliberately does not carry
        the catalog screen's `is_owned`.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        npi_number:
          type: string
          description: 10-digit National Provider Identifier, or blank if not recorded.
          maxLength: 10
          pattern: ^(\d{10})?$
      required:
      - id
      - name
    SurgeonCatalog:
      type: object
      description: 'The Directory Profiles shape: a surgeon plus whether you may edit
        it.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        npi_number:
          type: string
          description: 10-digit National Provider Identifier, or blank if not recorded.
          maxLength: 10
          pattern: ^(\d{10})?$
        is_owned:
          type: boolean
          readOnly: true
          description: True when this row belongs to your organization and may be
            renamed or removed. False for the shared roster, which is readable by
            everyone and writable by nobody.
      required:
      - id
      - is_owned
      - name
    SurgeonWriteRequest:
      type: object
      description: |-
        Create/update payload for a surgeon an organization owns.

        Two writable fields, which makes this the first directory entity that is
        not simply a name. `npi_number` stays optional, as the model has it: a
        surgeon can be recorded before anyone has looked their NPI up.

        Note this runs `npi_validator`, which the legacy `create_surgeon` endpoint
        does not — it writes `request.data['npi_number']` straight through, so that
        path still accepts anything ten characters wide.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        npi_number:
          type: string
          description: 10-digit National Provider Identifier (Type 1 - Individual)
            for this surgeon.
          pattern: ^\d{10}$
          maxLength: 10
      required:
      - name
    TokenRefreshData:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required:
      - access_token
      - refresh_token
    TokenRefreshResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/TokenRefreshData'
      required:
      - data
      - message
    TrackingEvent:
      type: object
      description: Read-only view of a tracking event (a tracker's location history
        entry).
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
          description: When the event occurred (UTC) — `occurred_at` for tracking,
            `cycled_at` for cycles.
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        location_name:
          type: string
          readOnly: true
        location_city:
          type: string
          readOnly: true
        location_state:
          type: string
          readOnly: true
        location_country:
          type: string
          readOnly: true
        beacon_identifier:
          type: string
          readOnly: true
          description: Raw beacon identifier as received (matches Tracker.beacon_id).
        asset_name:
          type: string
          readOnly: true
        user_name:
          type: string
          readOnly: true
      required:
      - asset_name
      - beacon_identifier
      - event_type
      - id
      - latitude
      - location_city
      - location_country
      - location_name
      - location_state
      - longitude
      - occurred_at
      - user_name
    TransferTarget:
      type: object
      description: 'One selectable From/To value: its kind, its id, and the label
        to show.'
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TransferTargetTypeEnum'
          description: |-
            Which *_assigned_to_<type> column this option writes.

            * `representative` - Representative
            * `facility` - Facility
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
      - type
    TransferTargetResponse:
      type: object
      description: 'Assignable transfer destinations: representatives, then facilities.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TransferTarget'
      required:
      - results
    TransferTargetTypeEnum:
      enum:
      - representative
      - facility
      type: string
      description: |-
        * `representative` - Representative
        * `facility` - Facility
    TransportMethodEnum:
      enum:
      - fedex
      - ups
      - rep
      - other
      type: string
      description: |-
        * `fedex` - FedEx
        * `ups` - UPS
        * `rep` - Rep
        * `other` - Other
    UserLoginSerilaizerRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 100
      required:
      - email
      - password
    UserProfileDetail:
      type: object
      description: Full serializer for detail/create/update views.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_email:
          type: string
          format: email
          readOnly: true
        organization_type:
          nullable: true
          description: |-
            User belongs to exactly ONE: parent company, manufacturer, or facility.

            * `distributor` - Distributor
            * `oem` - OEM
            * `facility` - Facility (Hospital)
