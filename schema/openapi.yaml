    UserRegistrationRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        last_login:
          type: string
          format: date-time
          nullable: true
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
        is_staff:
          type: boolean
        phone_number:
          type: string
          minLength: 1
          description: 10-digit phone number for SMS/OTP verification.
          maxLength: 10
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        is_approved:
          allOf:
          - $ref: '#/components/schemas/IsApprovedEnum'
          description: |-
            Approval status. Pending users cannot access the system.

            * `pending` - Pending
            * `approved` - Approved
            * `rejected` - Rejected
        is_blocked:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        dismissed_banners:
          description: Onboarding tip banners the user has dismissed. Maps banner_id
            (str) -> version (int).
        hide_all_tips:
          type: boolean
          description: If True, suppress all onboarding tip banners regardless of
            dismissed state.
        reports_to:
          type: integer
          nullable: true
          description: User's manager in the reporting hierarchy
        groups:
          type: array
          items:
            type: integer
          description: The groups this user belongs to. A user will get all permissions
            granted to each of their groups.
        user_permissions:
          type: array
          items:
            type: integer
          description: Specific permissions for this user.
      required:
      - email
      - password
      - phone_number
    ValidateOtpEmailRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address
        otp:
          type: string
          minLength: 1
          description: OTP code
      required:
      - email
      - otp
    WebError:
      type: object
      description: |-
        Stable error shape for /api/v1/web/*.

        `code` is the machine-readable discriminator to branch on; `detail` is
        display text and may change without notice.
      properties:
        code:
          type: string
          description: e.g. invalid_credentials, account_pending, refresh_token_missing,
            refresh_token_invalid, throttled.
        detail:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Present only for validation failures.
      required:
      - code
      - detail
    WebLoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    WebLoginResponse:
      type: object
      description: |-
        The refresh token is deliberately absent: it is set as an httpOnly
        cookie and must never be readable by scripts.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds. Refresh before it elapses
            rather than waiting for a 401.
        user:
          $ref: '#/components/schemas/WebUser'
      required:
      - access_token
      - expires_in
      - user
    WebOrganization:
      type: object
      description: One organization membership.
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        is_primary:
          type: boolean
      required:
      - id
      - is_primary
      - name
      - role
      - type
    WebRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
      required:
      - access_token
      - expires_in
    WebUser:
      type: object
      description: The signed-in user, as much as the SPA needs to render a shell.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          nullable: true
          description: UserProfile.role — the value all API permission checks use.
        organization_name:
          type: string
          nullable: true
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/WebOrganization'
      required:
      - email
      - id
      - name
      - organization_name
      - organizations
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
