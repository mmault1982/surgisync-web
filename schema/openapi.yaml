  /api/v1/inventory-transfers/{id}/confirm-receipt/:
    post:
      operationId: confirm_inventory_transfer_receipt
      description: 'Confirm receipt of a transfer. Copies the transfer''s destination
        (to_*) onto each associated kit''s assigned_to_* fields, then soft-deletes
        the transfer so its kits are no longer in transit. For a return-to-manufacturer
        transfer (reason ''return'' with no destination facility or representative),
        the kits are instead detached and soft-deleted along with the transfer. Idempotent:
        an already-confirmed transfer returns 404.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Inventory Transfer.
        required: true
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryTransferDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: No such object, or it belongs to another organization. The
            two are deliberately indistinguishable.
  /api/v1/inventory-transfers/targets/:
    get:
      operationId: list_inventory_transfer_targets
      description: 'Assignable From/To values for a transfer: the representatives
        in the requesting user''s organization, then the facilities that user may
        send to, each block sorted by name. Every option carries a `type` because
        a transfer stores each side as three nullable FK columns and the ids collide
        across them — `type` says which `*_assigned_to_<type>` field the option writes.
        Organizations are not offered; a kit assigned to one keeps that assignment
        until it is transferred away. Not the global /api/v1/facilities/ catalog.'
      tags:
      - Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTargetResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication credentials were not supplied or are invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authenticated, but not permitted to perform this action.
