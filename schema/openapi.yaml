            * `kit` - Kit
            * `component` - Component
        is_serialized:
          type: boolean
          description: Serialized parts are stocked one row per physical unit (quantity
            1, own lot/expiry); bulk parts are stocked one row per location with a
            quantity.
        description:
          type: string
          minLength: 1
          maxLength: 256
        reference_number:
          type: string
          nullable: true
          description: Unique catalog number used for scanning and inventory lookup.
            Empty for kits.
          maxLength: 20
        udi:
          type: string
          nullable: true
          description: Unique Device Identifier - FDA-required tracking number for
            medical devices.
          maxLength: 50
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
