          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateOtpEmailRequestRequest'
        required: true
      responses:
        '200':
          description: OTP validated successfully
  /api/v1/verify_invite/:
    get:
      operationId: verify_invite_token
      description: Verify if an invite token is valid (used before showing password
        form).
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Invite token
      tags:
      - Authentication
      responses:
        '200':
          description: Invite token validity and user info
  /api/v1/web/login/:
    post:
      operationId: web_login
      description: Sign in from a browser. Returns an access token in the body and
        sets the refresh token as an httpOnly, host-only cookie scoped to /api/v1/web/.
        The refresh token is never present in the body and must never be stored by
        the client.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebLoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebLoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Not authenticated.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Account cannot sign in.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Rate limited.
  /api/v1/web/logout/:
    post:
      operationId: web_logout
      description: 'End the browser session: revokes the refresh token and clears
        the cookie. Idempotent — succeeds even with no cookie, an already-revoked
        token, or no access token, since the access token has often expired by the
        time a user signs out.'
      tags:
      - Authentication
      responses:
        '204':
          description: Session ended.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Rate limited.
  /api/v1/web/refresh/:
    post:
      operationId: web_token_refresh
      description: 'Exchange the refresh cookie for a new access token. The refresh
        token is rotated: the presented one is revoked and its replacement is set
        as the new cookie. The cookie is read from the request and is not a parameter.
        Any 401 clears the cookie, so a client holding a dead session reaches the
        sign-in screen instead of retrying.'
      tags:
      - Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebRefreshResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Validation failed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Not authenticated.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Account cannot sign in.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebError'
          description: Rate limited.
