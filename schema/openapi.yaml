          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseItemResponse'
          description: ''
        '400':
          description: Bad request due to missing or invalid parameters
        '404':
          description: Case not found
